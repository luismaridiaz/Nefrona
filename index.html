<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NEFRONA"><meta name="theme-color" content="#0f766e"><title>NEFRONA</title><style>:root{--bg:#f4f7f8;--card:#fff;--ink:#14282e;--mut:#5b7078;--pri:#0f766e;--pri2:#115e59;--acc:#b45309;--bad:#b91c1c;--ok:#15803d;--line:#d9e3e6;--chip:#e6f2f1;--warn:#fef3c7;--info:#e0f2fe;--alert:#fee2e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1e;--card:#15262b;--ink:#e6f0f2;--mut:#9ab2ba;--pri:#2dd4bf;--pri2:#5eead4;--acc:#fbbf24;--bad:#f87171;--ok:#4ade80;--line:#264048;--chip:#1b3a3f;--warn:#3a2f0f;--info:#10303f;--alert:#3f1717}}
:root[data-theme="dark"]{--bg:#0d1a1e;--card:#15262b;--ink:#e6f0f2;--mut:#9ab2ba;--pri:#2dd4bf;--pri2:#5eead4;--acc:#fbbf24;--bad:#f87171;--ok:#4ade80;--line:#264048;--chip:#1b3a3f;--warn:#3a2f0f;--info:#10303f;--alert:#3f1717}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header b{font-size:20px;letter-spacing:.14em}
header .sp{flex:1}header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;width:40px;height:36px;font-size:18px;cursor:pointer}header span.t{font-size:12px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:12px 16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 2px 7px;font-size:11px;font-family:inherit;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:20px;line-height:1.1}
nav button.on{color:var(--pri);font-weight:700}
h2{font-size:20px;margin:6px 0 10px}
h3{font-size:16px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.card h3:first-child{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
input[type=checkbox]{flex:none;width:20px;min-width:20px;height:20px;min-height:0;margin:0 8px 0 0;vertical-align:middle}
.ck{display:flex;align-items:center;padding:5px 0;font-size:15px;color:var(--ink);margin:0}
.btn{display:inline-block;border:0;border-radius:12px;padding:11px 16px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn.s{background:var(--chip);color:var(--pri2)}
.btn.w{width:100%}
.btn.sm{padding:6px 10px;min-height:34px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip.done{border-color:var(--ok)}
.tag{display:inline-block;background:var(--chip);color:var(--pri2);border-radius:8px;padding:1px 7px;font-size:12px;margin:0 3px 3px 0;cursor:pointer}
.tag.v0{background:var(--warn);color:var(--acc)}
.box{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.box.info{background:var(--info)}.box.warn{background:var(--warn)}.box.alert{background:var(--alert)}
.mut{color:var(--mut);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{background:var(--chip);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:18px}
.kv small{color:var(--mut)}
.meter{margin:5px 0}
.meter .t{display:flex;justify-content:space-between;font-size:13px}
.meter .b{height:7px;background:var(--line);border-radius:5px;overflow:hidden}
.meter .b i{display:block;height:100%;background:var(--pri)}
.meter.over .b i{background:var(--bad)}
.meal{border-top:1px solid var(--line);padding:9px 0}
.meal:first-child{border-top:0}
.meal .h{display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.meal .h b{font-size:15px}.meal .h .mut{white-space:nowrap}
.meal ul{margin:6px 0 4px;padding-left:18px;font-size:14px}
.meal .det{margin-top:6px;font-size:14px}
.meal ol{padding-left:20px;margin:4px 0}
.ex{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.ex b{font-size:15px}
.ack{display:flex;gap:8px;align-items:flex-start}
#run{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 30px}
#run .big{font-size:54px;font-weight:700;text-align:center;color:var(--pri)}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:30}
#print{display:none}
@media print{header,nav,main,#run,.toast{display:none!important}#print{display:block;color:#000;background:#fff;font-size:11px}#print h2{page-break-before:always}#print table{border-collapse:collapse;width:100%}#print td,#print th{border:1px solid #999;padding:3px;vertical-align:top}}

header .ti{display:flex;flex-direction:column;line-height:1}header .ti small{font-size:9px;letter-spacing:.2em;opacity:.8;margin-top:2px}

var FRUTAS = {
  manzana: { m: [1, 12], g: 150 }, pera: { m: [8, 4], g: 150 }, fresas: { m: [3, 6], g: 120 },
  arandanos: { m: [5, 9], g: 100 }, uvas: { m: [8, 11], g: 100 }, mandarina: { m: [10, 2], g: 150 },
  naranja: { m: [11, 5], g: 150 }, pina: { m: [1, 12], g: 150 }, sandia: { m: [6, 9], g: 200 },
  melocoton: { m: [6, 9], g: 140 }, ciruela: { m: [6, 9], g: 120 }, cerezas: { m: [5, 7], g: 100 },
  platano: { m: [1, 12], g: 100 }, kiwi: { m: [11, 4], g: 120 }, melon: { m: [6, 9], g: 150 }
};
function inSeason(foodId, month) {
  var s = FRUTAS[foodId]; if (!s) { return true; }
  var a = s.m[0], b = s.m[1];
  return a <= b ? (month >= a && month <= b) : (month >= a || month <= b);
}

  /* progresión por nivel (semanas 1-8): minutos aeróbicos por sesión, días aeróbicos/sem, series de fuerza, repeticiones */

  var LEVEL_NAME = ['Nivel 0 · Sentado y asistido', 'Nivel 1 · Base baja', 'Nivel 2 · Base media', 'Nivel 3 · Base buena'];

  function has(a, x) { for (var i = 0; i < a.length; i++) { if (a[i] === x) { return true; } } return false; }

  /* ---- nivel funcional ----

     grip (kg), gait (m/s) opcionales; falls: nº caídas en el último año; act: min/semana de actividad moderada */
  E.level = function (f, sex, age) {

    else if (sts <= 12) { s += 3; } else if (sts <= 15) { s += 2; } else { s += 1; low.sts = true; notes.push('5 levantadas de silla > 15 s: fuerza de piernas baja (umbral EWGSOP2).'); }

    else if (kind === 'B') { ex = [].concat(pick('hing', 1, flags, level, false, off), pick('sq', 1, flags, level, false, off + 1), pick('push', 2, flags, level, false, off), pick('pull', 1, flags, level, false, off + 1), pick('grip', 1, flags, level, false, 0), pick('abd', 1, flags, level, false, off + 1)); }
